name: Flutter Build

on:
  push:
    branches:
      - main
      - master
      - dev
      - feature/*

jobs:
  build:
    name: Build Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract App Version
        id: extract_version
        run: |
          # Extract the version from pubspec.yaml
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d "+" -f 1)
          echo "App version is $version"
          # Set it as an output so it can be used later
          echo "::set-output name=version::$version"

      - name: Build APK
        run: flutter build apk --release --target=lib/login.dart --no-tree-shake-icons

      - name: Rename APK
        run: |
          # Rename the APK file using the extracted version
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/jaberah-${{ steps.extract_version.outputs.version }}.apk

      - name: Generate Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK
          path: build/app/outputs/flutter-apk/jaberah-${{ steps.extract_version.outputs.version }}.apk

      - name: Refresh Dropbox Access Token
        id: refresh_dropbox_token
        run: |
          response=$(curl -X POST https://api.dropbox.com/oauth2/token \
            -u "${{ secrets.DROPBOX_CLIENT_ID }}:${{ secrets.DROPBOX_CLIENT_SECRET }}" \
            -d grant_type=refresh_token \
            -d refresh_token=${{ secrets.DROPBOX_REFRESH_TOKEN }})
          # Extract the new access token from the JSON response
          access_token=$(echo "$response" | jq -r '.access_token')
          echo "New access token: $access_token"
          echo "::set-output name=access_token::$access_token"

      - name: Upload APK to Dropbox
        id: upload_to_dropbox
        uses: deka0106/upload-to-dropbox@v2
        with:
          dropbox_access_token: ${{ steps.refresh_dropbox_token.outputs.access_token }}
          src: build/app/outputs/flutter-apk/jaberah-${{ steps.extract_version.outputs.version }}.apk
          dest: /jaberah-${{ steps.extract_version.outputs.version }}.apk

      - name: Get Sharable Link from Dropbox
        id: get_sharable_link
        run: |
          response=$(curl -X POST https://api.dropboxapi.com/2/files/get_temporary_link \
            -H "Authorization: Bearer ${{ steps.refresh_dropbox_token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{"path": "/jaberah-${{ steps.extract_version.outputs.version }}.apk"}')
          # Extract the link from the JSON response
          link=$(echo $response | jq -r '.link')
          echo "Sharable link: $link"
          echo "::set-output name=link::$link"

      - name: Update Version
        uses: fjogeleit/http-request-action@v1
        with:
          url: '${{ secrets.BACKEND_API }}?url=${{ steps.get_sharable_link.outputs.link }}&version=${{ steps.extract_version.outputs.version }}'
          method: 'PUT'
          headers: |
            accept: */*
