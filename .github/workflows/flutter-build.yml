name: Flutter Build

on:
  push:
    branches:
      - main
      - master
      - dev
      - feature/*

jobs:
  build:
    name: Build Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract App Version
        id: extract_version
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d "+" -f 1)
          echo "App version is $version"
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Build APK
        run: flutter build apk --release --target=lib/login.dart --no-tree-shake-icons

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/jaberah-${VERSION}.apk

      - name: Generate Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK
          path: build/app/outputs/flutter-apk/jaberah-${VERSION}.apk

      - name: Refresh Dropbox Access Token
        id: refresh_dropbox_token
        run: |
          response=$(curl -X POST https://api.dropbox.com/oauth2/token \
            -u "${{ secrets.DROPBOX_CLIENT_ID }}:${{ secrets.DROPBOX_CLIENT_SECRET }}" \
            -d grant_type=refresh_token \
            -d refresh_token=${{ secrets.DROPBOX_REFRESH_TOKEN }})
          access_token=$(echo "$response" | jq -r '.access_token')
          echo "DROPBOX_ACCESS_TOKEN=$access_token" >> $GITHUB_ENV

      - name: Upload APK to Dropbox (Overwrite if Exists)
        id: upload_to_dropbox
        run: |
          curl -X POST https://content.dropboxapi.com/2/files/upload \
            --header "Authorization: Bearer $DROPBOX_ACCESS_TOKEN" \
            --header "Dropbox-API-Arg: {\"path\": \"/jaberah-${VERSION}.apk\", \"mode\": \"overwrite\"}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @build/app/outputs/flutter-apk/jaberah-${VERSION}.apk

      - name: Get Permanent Direct Download Link from Dropbox
        id: get_sharable_link
        run: |
          response=$(curl -X POST https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings \
            -H "Authorization: Bearer $DROPBOX_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"path\": \"/jaberah-${VERSION}.apk\", \"settings\": {\"requested_visibility\": \"public\"}}")
          link=$(echo $response | jq -r '.url' | sed 's/?dl=0/?raw=1/' | sed 's/?dl=1/?raw=1/')
          echo "DIRECT_DOWNLOAD_LINK=$link" >> $GITHUB_ENV

      - name: Update Version in Backend
        uses: fjogeleit/http-request-action@v1
        with:
          url: '${{ secrets.BACKEND_API }}?url=${{ env.DIRECT_DOWNLOAD_LINK }}&version=${{ env.VERSION }}'
          method: 'PUT'
          headers: |
            accept: */*

